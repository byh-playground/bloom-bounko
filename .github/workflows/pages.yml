name: Verify source and deploy static Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node for authored SVG verification
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify original SVG inventory, hashes, and runtime manifest
        run: |
          npm run vector-assets:check
          npm run test:vector-assets
      - name: Check entry module syntax
        run: |
          node --check src/main.js
          git diff --check
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static artifact and provenance
        run: |
          npm run vector-assets:check
          npm run test:vector-assets
          mkdir -p _site
          cp index.html _site/index.html
          cp -R src _site/src
          cp pets.js _site/pets.js
          cp theme-progress.js _site/theme-progress.js
          cp audio.js _site/audio.js
          cp abilities.js _site/abilities.js
          cp drops.js _site/drops.js
          cp enemies.js _site/enemies.js
          cp controllers.js _site/controllers.js
          cp ultimates.js _site/ultimates.js
          cp preview.js _site/preview.js
          cp tech-view.js _site/tech-view.js
          cp player-presentation.js _site/player-presentation.js
          cp presentation-view.js _site/presentation-view.js
          cp vector-actors.js _site/vector-actors.js
          cp vector-assets-runtime.js _site/vector-assets-runtime.js
          cp vector-assets.manifest.js _site/vector-assets.manifest.js
          cp i18n.js _site/i18n.js
          mkdir -p _site/assets/vector
          cp -R assets/vector/actors _site/assets/vector/actors
          cp -R assets/vector/eggs _site/assets/vector/eggs
          mkdir -p _site/locales
          cp locales/ko.js locales/en.js _site/locales/
          touch _site/.nojekyll
          python3 - <<'PY'
          import datetime, hashlib, json, os, pathlib, re
          path = pathlib.Path('_site/index.html')
          data = path.read_bytes()
          html = data.decode('utf-8')
          game_source = pathlib.Path('_site/src/main.js').read_text(encoding='utf-8')
          metadata = {
              'commit': os.environ['GITHUB_SHA'],
              'built_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'version': re.search(r"(?m)^const VERSION = '([^']+)'", game_source).group(1),
              'build_id': re.search(r"(?m)^const VERSION = '[^']+', BUILD_ID = '([^']+)'", game_source).group(1),
              'gamekit_sdk_commit': re.search(r"KIT = 'https://cdn.jsdelivr.net/gh/byh-playground/bloom-gamekit@([^/]+)/'", game_source).group(1),
              'gamekit_sdk_version': re.search(r"KIT_VERSION = '([^']+)'", game_source).group(1),
              'gamekit_sdk_source_commit': re.search(r"KIT_SOURCE_COMMIT = '([^']+)'", game_source).group(1),
              'gamekit_diagnostics_commit': re.search(r"DIAGNOSTICS = 'https://cdn.jsdelivr.net/gh/byh-playground/bloom-gamekit@([^/]+)/debug-tools.js'", game_source).group(1),
              'gamekit_diagnostics_sha256': re.search(r"DIAGNOSTICS_SHA256 = '([^']+)'", game_source).group(1),
              'gamekit_manifest_sha256': re.search(r"KIT_MANIFEST_SHA256 = '([^']+)'", game_source).group(1),
              'gamekit_interpolation_sha256': re.search(r"KIT_INTERPOLATION_SHA256 = '([^']+)'", game_source).group(1),
              'gamekit_vector_assets_sha256': re.search(r"KIT_VECTOR_ASSETS_SHA256 = '([^']+)'", game_source).group(1),
              'gamekit_input_sha256': re.search(r"KIT_INPUT_SHA256 = '([^']+)'", game_source).group(1),
              'gamekit_simloop_sha256': re.search(r"KIT_SIMLOOP_SHA256 = '([^']+)'", game_source).group(1),
              'gamekit_camera_sha256': re.search(r"KIT_CAMERA_SHA256 = '([^']+)'", game_source).group(1),
              'gamekit_navigation_sha256': re.search(r"KIT_NAVIGATION_SHA256 = '([^']+)'", game_source).group(1),
              'gamekit_scenario_sha256': re.search(r"KIT_SCENARIO_SHA256 = '([^']+)'", game_source).group(1),
              'gamekit_audio_sha256': re.search(r"KIT_AUDIO_SHA256 = '([^']+)'", game_source).group(1),
              'gamekit_vector_loader_commit': re.search(r"VECTOR_LOADER = 'https://cdn.jsdelivr.net/gh/byh-playground/bloom-gamekit@([^/]+)/vector-assets-loader.js'", game_source).group(1),
              'gamekit_vector_loader_sha256': re.search(r"VECTOR_LOADER_SHA256 = '([^']+)'", game_source).group(1),
              'gamekit_vector_loader_manifest_sha256': re.search(r"VECTOR_LOADER_MANIFEST_SHA256 = '([^']+)'", game_source).group(1),
              'gamekit_vector_loader_version': re.search(r"KIT_VERSION = '([^']+)'", game_source).group(1),
              'gamekit_rendering_sha256': re.search(r"KIT_RENDERING_SHA256 = '([^']+)'", game_source).group(1),
              'gamekit_bm_sha256': re.search(r"KIT_BM_SHA256 = '([^']+)'", game_source).group(1),
              'gamekit_bm_ima_sha256': re.search(r"KIT_BM_IMA_SHA256 = '([^']+)'", game_source).group(1),
              'gamekit_save_sha256': re.search(r"KIT_SAVE_SHA256 = '([^']+)'", game_source).group(1),
              'gamekit_pins': sorted({pin for source in ('_site/src/main.js', '_site/audio.js')
                  for pin in re.findall(r"bloom-gamekit@([0-9a-f]{40})", pathlib.Path(source).read_text(encoding='utf-8'))}),
              'index_sha256': hashlib.sha256(data).hexdigest(),
              'vector_runtime_sha256': hashlib.sha256(pathlib.Path('_site/vector-actors.js').read_bytes()).hexdigest(),
              'vector_assets_manifest_sha256': hashlib.sha256(pathlib.Path('_site/vector-assets.manifest.js').read_bytes()).hexdigest(),
              'vector_assets_runtime_loader_sha256': hashlib.sha256(pathlib.Path('_site/vector-assets-runtime.js').read_bytes()).hexdigest(),
              'vector_source_sha256': {p.relative_to('_site').as_posix(): hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in sorted(pathlib.Path('_site/assets/vector').rglob('*.svg'))},
              'vector_source_count': len(list(pathlib.Path('_site/assets/vector').rglob('*.svg'))),
              'vector_source_bytes': sum(p.stat().st_size for p in pathlib.Path('_site/assets/vector').rglob('*.svg')),
              'vector_compiled_assets_bytes': 0,
              'vector_previous_compiled_bundle_bytes': 1446734,
              'theme_progress_sha256': hashlib.sha256(pathlib.Path('_site/theme-progress.js').read_bytes()).hexdigest(),
              'pets_sha256': hashlib.sha256(pathlib.Path('_site/pets.js').read_bytes()).hexdigest(),
              'drops_sha256': hashlib.sha256(pathlib.Path('_site/drops.js').read_bytes()).hexdigest(),
              'abilities_sha256': hashlib.sha256(pathlib.Path('_site/abilities.js').read_bytes()).hexdigest(),
              'presentation_view_sha256': hashlib.sha256(pathlib.Path('_site/presentation-view.js').read_bytes()).hexdigest(),
              'player_presentation_sha256': hashlib.sha256(pathlib.Path('_site/player-presentation.js').read_bytes()).hexdigest(),
              'tech_view_sha256': hashlib.sha256(pathlib.Path('_site/tech-view.js').read_bytes()).hexdigest(),
              'preview_sha256': hashlib.sha256(pathlib.Path('_site/preview.js').read_bytes()).hexdigest(),
              'ultimates_sha256': hashlib.sha256(pathlib.Path('_site/ultimates.js').read_bytes()).hexdigest(),
              'controllers_sha256': hashlib.sha256(pathlib.Path('_site/controllers.js').read_bytes()).hexdigest(),
              'enemies_sha256': hashlib.sha256(pathlib.Path('_site/enemies.js').read_bytes()).hexdigest(),
              'audio_sha256': hashlib.sha256(pathlib.Path('_site/audio.js').read_bytes()).hexdigest(),
              'i18n_sha256': hashlib.sha256(pathlib.Path('_site/i18n.js').read_bytes()).hexdigest(),
              'locale_ko_sha256': hashlib.sha256(pathlib.Path('_site/locales/ko.js').read_bytes()).hexdigest(),
              'locale_en_sha256': hashlib.sha256(pathlib.Path('_site/locales/en.js').read_bytes()).hexdigest(),
              'i18next_version': '26.4.3',
              'i18next_esm_sha256': '4fb2e0c4dfd13dda4f6cb292ae0f9c5260a13b28bab05ee723915351bdaf00a1',
              'audio_sdk_commit': re.search(r"commit:'([^']+)'", pathlib.Path('_site/audio.js').read_text(encoding='utf-8')).group(1),
              'audio_sdk_sha256': re.search(r"sha256:'([^']+)'", pathlib.Path('_site/audio.js').read_text(encoding='utf-8')).group(1),
          }
          assert metadata['gamekit_sdk_commit'] == metadata['audio_sdk_commit'], 'GameKit pins must match'
          assert metadata['gamekit_pins'] == [metadata['gamekit_sdk_commit']], 'Every GameKit module must use the one SDK dist pin'
          assert metadata['version'] == '0.25.0', 'Bounko product version changed'
          assert metadata['build_id'] == '20261031T-gamekit-v0.39.0-1a3ef38', 'Bounko build ID changed'
          assert metadata['gamekit_sdk_commit'] == '1a3ef3877dea431268c712cbe7b13b2600826119', 'GameKit SDK dist commit changed'
          assert metadata['gamekit_sdk_source_commit'] == 'd5c35c3d4fec366e672c9a5889104ea47a300683', 'GameKit SDK source commit changed'
          assert metadata['gamekit_sdk_version'] == '0.39.0', 'GameKit SDK version changed'
          assert metadata['gamekit_diagnostics_commit'] == metadata['gamekit_sdk_commit'], 'GameKit diagnostics must share the SDK dist pin'
          assert metadata['gamekit_diagnostics_sha256'] == 'bd077de55035f4e258d341318108b32613de5153d09aa5f6edca6ad31eedb4a4', 'GameKit diagnostics module hash changed'
          assert metadata['gamekit_manifest_sha256'] == 'ef220fd3801549c88b0044c2bcfa92f4a7de40ce49626e0199ed8e5b1a58f2c0', 'GameKit manifest hash changed'
          assert metadata['gamekit_bm_sha256'] == '00b3ff79285fc1e3568ed2cd32a4b9065bbcf5947586763087e756f722c5440b', 'GameKit bm.js hash changed'
          assert metadata['gamekit_bm_ima_sha256'] == '6602a5589533b138e69c7812518c46417826c0a303ca4c47ba0b24201ba8eb97', 'GameKit bm-ima.js hash changed'
          assert metadata['gamekit_save_sha256'] == '50164b43313c93dca7ebf076456a3b319b0825a0b5c6f5712af8d3286d604cfc', 'GameKit save.js hash changed'
          assert metadata['gamekit_interpolation_sha256'] == 'acad7ad93615633609a62e484bff918980fc84282840db9b5cd108e8f5bb133a', 'GameKit interpolation.js hash changed'
          assert metadata['gamekit_vector_assets_sha256'] == 'de7093c51d5ffd80d6bd716a0023a9b78586a1a9b10d607eb730109ba1af694c', 'GameKit vector-assets.js hash changed'
          assert metadata['gamekit_input_sha256'] == 'a969755a39702723b35b6a1503e9b2e53a431ea91845017474c979752fdfb51f', 'GameKit input.js hash changed'
          assert metadata['gamekit_simloop_sha256'] == 'c25a8f7f4999e4fe8beb6b08167fa4d0934c34098db2bf912335e81db53c4ef8', 'GameKit simloop.js hash changed'
          assert metadata['gamekit_camera_sha256'] == '99c1be43b6a38945028d029a5ecc594f7ff6dfc71075305264930748cafe88b6', 'GameKit camera.js hash changed'
          assert metadata['gamekit_navigation_sha256'] == '2c8e12432f6eae5472418d80898c93af32f5b14dce8217f6fa75bd198893b417', 'GameKit navigation.js hash changed'
          assert metadata['gamekit_scenario_sha256'] == 'b21a2be85b497588589c796f8e95f932c464474cc4ea3f703a8718e96a9946ce', 'GameKit scenario.js hash changed'
          assert metadata['gamekit_audio_sha256'] == 'baf50e63457ccc7e66859ee9018049b0f53ef49e5b7c90b1395d2995bdcf6df1', 'GameKit audio.js hash changed'
          assert metadata['gamekit_rendering_sha256'] == 'cf39f38e1644e2fdca168ee17ce556f09bddb05bfa4e8e89c310ce116d62d97e', 'GameKit rendering.js hash changed'
          assert metadata['gamekit_vector_loader_commit'] == metadata['gamekit_sdk_commit'], 'GameKit vector loader must share the SDK dist pin'
          assert metadata['gamekit_vector_loader_sha256'] == '277a44071e6c7294a14081cfcf2f8cf0e8f9fc72c7c67b40be20bbfb14966e03', 'GameKit vector-assets-loader.js hash changed'
          assert metadata['gamekit_vector_loader_manifest_sha256'] == 'ef220fd3801549c88b0044c2bcfa92f4a7de40ce49626e0199ed8e5b1a58f2c0', 'GameKit vector loader dist manifest hash changed'
          assert metadata['gamekit_vector_loader_version'] == '0.39.0', 'GameKit vector loader version changed'
          assert metadata['gamekit_vector_loader_manifest_sha256'] == metadata['gamekit_manifest_sha256'], 'GameKit module and loader manifest pins must match'
          assert metadata['vector_source_count'] == 49, 'Unexpected SVG source count'
          assert metadata['vector_source_bytes'] == 356397, 'Authored SVG payload changed'
          assert metadata['vector_compiled_assets_bytes'] == 0, 'Compiled vector data must not be shipped'
          assert not pathlib.Path('_site/vector-assets.generated.js').exists(), 'Compiled vector data must not be shipped'
          pathlib.Path('_site/build.json').write_text(json.dumps(metadata, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Publish bloom-game.json with the Nightly tag name
        run: |
          curl -fsS https://raw.githubusercontent.com/byh-playground/bloom-world/main/playground/bloom-game.schema.json -o "$RUNNER_TEMP/schema.json"
          STAMP=$(date -u -d "@$(git show -s --format=%ct "$GITHUB_SHA")" +%Y%m%dT%H%M%SZ)
          jq --arg t "nightly-$STAMP-${GITHUB_SHA:0:12}" '. + {nightly:$t}' bloom-game.json > _site/bloom-game.json
          npx --yes ajv-cli@5 validate --spec=draft2020 -s "$RUNNER_TEMP/schema.json" -d _site/bloom-game.json
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
